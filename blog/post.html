<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Alcedo Works</title>
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/underwater.css">
</head>
<body data-page="article">

<nav>
  <a href="../index.html" class="nav-logo">
    <svg viewBox="0 0 28 28" fill="none"><ellipse cx="14" cy="15" rx="7" ry="4.5" fill="#00B4D8"/><ellipse cx="14" cy="15" rx="5" ry="3" fill="#FF6B35" transform="rotate(10 14 15)"/><circle cx="19" cy="11" r="3.5" fill="#00B4D8"/><circle cx="20" cy="10.5" r="1" fill="#0D1B2A"/><polygon points="22,11 26,10 22,13" fill="#FF6B35"/><polygon points="7,15 2,16 7,18" fill="#00B4D8"/></svg>
    Alcedo Works
  </a>
  <ul class="nav-links">
    <li><a href="../portfolio/index.html">Portfolio</a></li>
    <li><a href="../blog/index.html">Blog</a></li>
    <li><a href="../index.html#about">About</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</nav>

<div style="max-width:800px; margin:0 auto; padding:100px 2rem 4rem;">
  <a href="index.html" style="color:var(--text-muted); font-size:0.85rem;">← Blog 一覧へ</a>
  <div id="post-meta" style="margin: 1.5rem 0 0.5rem;"></div>
  <div id="post-body" class="md-content"></div>
</div>

<footer>
  <span class="footer-logo">Alcedo Works</span>
  &copy; 2026 Alcedo Works. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../js/md-render.js"></script>
<script>
  // Lazy-load animation scripts after content is ready
  window.addEventListener('load', () => {
    ['../js/article-bird.js', '../js/article-effects.js'].forEach(src => {
      const s = document.createElement('script');
      s.src = src;
      document.body.appendChild(s);
    });
  });
</script>
<script>
  const slug = getSlug();
  if (slug) {
    renderMarkdown(`../content/blog/${slug}.md`, 'post-body');
    fetch(`../data/blog.json`)
      .then(r => r.json())
      .then(posts => {
        const post = posts.find(p => p.slug === slug);
        if (post) {
          document.title = `${post.title} — Alcedo Works`;
          document.getElementById('post-meta').innerHTML =
            `<span style="color:var(--orange);font-size:0.8rem;letter-spacing:.08em;">${post.category}</span>
             <span style="color:var(--text-muted);font-size:0.8rem;margin-left:1rem;">${post.date}</span>`;
        }
      });
  } else {
    document.getElementById('post-body').innerHTML = '<p>記事が見つかりません。</p>';
  }
</script>
</body>
</html>
