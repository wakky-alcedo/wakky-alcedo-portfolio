<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Alcedo Works</title>
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">
    <svg viewBox="0 0 28 28" fill="none"><ellipse cx="14" cy="15" rx="7" ry="4.5" fill="#00B4D8"/><ellipse cx="14" cy="15" rx="5" ry="3" fill="#FF6B35" transform="rotate(10 14 15)"/><circle cx="19" cy="11" r="3.5" fill="#00B4D8"/><circle cx="20" cy="10.5" r="1" fill="#0D1B2A"/><polygon points="22,11 26,10 22,13" fill="#FF6B35"/><polygon points="7,15 2,16 7,18" fill="#00B4D8"/></svg>
    Alcedo Works
  </a>
  <ul class="nav-links">
    <li><a href="../portfolio/index.html">Portfolio</a></li>
    <li><a href="../blog/index.html">Blog</a></li>
    <li><a href="../index.html#about">About</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</nav>

<div style="max-width:800px; margin:0 auto; padding:100px 2rem 4rem;">
  <a href="index.html" style="color:var(--text-muted); font-size:0.85rem;">← Portfolio 一覧へ</a>
  <div id="item-body" class="md-content" style="margin-top:2rem;"></div>
</div>

<footer>
  <span class="footer-logo">Alcedo Works</span>
  &copy; 2026 Alcedo Works. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../js/md-render.js"></script>
<script>
  const slug = getSlug();
  if (slug) {
    renderMarkdown(`../content/portfolio/${slug}.md`, 'item-body');
    // ページタイトルも更新
    fetch(`../data/portfolio.json`)
      .then(r => r.json())
      .then(items => {
        const item = items.find(i => i.slug === slug);
        if (item) document.title = `${item.title} — Alcedo Works`;
      });
  } else {
    document.getElementById('item-body').innerHTML = '<p>作品が見つかりません。</p>';
  }
</script>
</body>
</html>
