<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Alcedo Works</title>
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">
    <svg viewBox="0 0 28 28" fill="none"><ellipse cx="14" cy="15" rx="7" ry="4.5" fill="#00B4D8"/><ellipse cx="14" cy="15" rx="5" ry="3" fill="#FF6B35" transform="rotate(10 14 15)"/><circle cx="19" cy="11" r="3.5" fill="#00B4D8"/><circle cx="20" cy="10.5" r="1" fill="#0D1B2A"/><polygon points="22,11 26,10 22,13" fill="#FF6B35"/><polygon points="7,15 2,16 7,18" fill="#00B4D8"/></svg>
    Alcedo Works
  </a>
  <ul class="nav-links">
    <li><a href="../portfolio/index.html">Portfolio</a></li>
    <li><a href="../blog/index.html">Blog</a></li>
    <li><a href="../index.html#about">About</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</nav>

<div class="page-header">
  <h1>Portfolio</h1>
  <p>これまでに作ってきたもの</p>
</div>

<section style="padding: 2rem;">
  <div class="portfolio-grid" id="portfolio-grid">
    <!-- data/portfolio.json から動的生成 -->
  </div>
</section>

<footer>
  <span class="footer-logo">Alcedo Works</span>
  &copy; 2026 Alcedo Works. All rights reserved.
</footer>

<script>
(async () => {
  const grid = document.getElementById('portfolio-grid');
  const res  = await fetch('../data/portfolio.json');
  const items = await res.json();

  grid.innerHTML = items.map(item => `
    <a href="item.html?slug=${item.slug}" style="text-decoration:none;">
      <div class="portfolio-card">
        <div class="portfolio-card-img">
          ${item.thumbnail
            ? `<img src="../${item.thumbnail}" alt="${item.title}" style="width:100%;height:100%;object-fit:cover;">`
            : `<span style="font-size:2.5rem;">⚙️</span>`}
        </div>
        <div class="portfolio-card-body">
          <div class="portfolio-card-tag">${item.category}</div>
          <div class="portfolio-card-title">${item.title}</div>
          <p class="portfolio-card-desc">${item.summary}</p>
        </div>
      </div>
    </a>
  `).join('');
})();
</script>
</body>
</html>
