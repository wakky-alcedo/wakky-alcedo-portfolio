services:
  portfolio:
    build: .
    image: wakky-alcedo-portfolio:latest
    restart: unless-stopped
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - portfolio
